name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [system]
        include:
          - os: ubuntu-latest
            node: download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shellcheck
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh
      - name: Install and rerun
        env:
          OMS_NO_MODIFY_PATH: '1'
        run: |
          export OMS_HOME="$RUNNER_TEMP/oms"
          if [ '${{ matrix.node }}' = download ]; then
            mkdir -p "$RUNNER_TEMP/no-node"
            for tool in uname git curl tar mkdir mktemp awk sha256sum rm mv dirname sed chmod sh; do
              ln -s "$(command -v "$tool")" "$RUNNER_TEMP/no-node/$tool"
            done
            # tar invokes gzip; npm invokes node from the private Node directory.
            ln -s "$(command -v gzip)" "$RUNNER_TEMP/no-node/gzip"
            OMS_SKIP_SOLANA=1 PATH="$RUNNER_TEMP/no-node" /bin/sh install.sh
          else
            sh install.sh
          fi
          sh install.sh
          "$OMS_HOME/bin/oms" --help

  test:
    name: Typecheck and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '22.19.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Install the pinned Surfpool
        run: node packages/cli/src/bin.ts doctor --install || true

      - name: Test
        run: |
          export SURFPOOL_BINARY="$(ls -d "$HOME"/.oms/tools/surfpool-*/surfpool | head -1)"
          npm test

  package:
    name: Build and smoke-test the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build the release archive
        run: npm run pack:release

      - name: Install into a clean directory and run it
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/.tmp/release/barestate-oms-*.tgz --ignore-scripts --no-audit --no-fund
          npx --no-install oms --version
          npx --no-install oms --help

  search-worker:
    name: Search Worker typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/search-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deploy/search-worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
